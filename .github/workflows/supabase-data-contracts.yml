name: Supabase data contracts

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/verify_supabase_migrations.ps1'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/verify_supabase_migrations.ps1'

jobs:
  migration-inventory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ordered imperative migrations
        shell: pwsh
        run: ./scripts/verify_supabase_migrations.ps1

  linked-security-checks:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Link protected staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check migration history and database advisors
        run: |
          supabase migration list --linked
          supabase db lint --linked --level warn
      - name: Generate non-deployable schema reference and detect drift
        run: |
          supabase db dump --linked --schema public --file supabase/schema.reference.sql
          test -s supabase/schema.reference.sql
          supabase db diff --linked --schema public --output supabase/schema.drift.sql
          test ! -s supabase/schema.drift.sql
      - name: Publish generated schema reference
        uses: actions/upload-artifact@v4
        with:
          name: supabase-schema-reference
          path: supabase/schema.reference.sql
      - name: Verify required RPCs are exposed only to authenticated users
        run: |
          supabase db query --linked "with required(name) as (values ('upsert_memorization_identity'), ('compare_and_swap_daily_plan'), ('compare_and_swap_custom_plan'), ('upsert_quran_bookmark'), ('claim_parent_reward')) select 1 / case when count(p.oid) = 5 then 1 else 0 end from required r left join pg_proc p on p.proname = r.name and p.pronamespace = 'public'::regnamespace"
          supabase db query --linked "select 1 / case when coalesce(bool_and(c.relrowsecurity), false) then 1 else 0 end from pg_class c where c.oid = 'public.quran_bookmarks_cloud'::regclass"
          supabase db query --linked "select 1 / case when exists (select 1 from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname in ('upsert_memorization_identity','compare_and_swap_daily_plan','compare_and_swap_custom_plan','upsert_quran_bookmark','claim_parent_reward') and has_function_privilege('public', p.oid, 'execute')) then 0 else 1 end"
