<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'Noto Naskh Arabic';
      src: url('https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/brand-assets/talia-naskh-font/NotoNaskhArabic-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-display: block;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Naskh Arabic', serif;
      background-color: #FFFCF2;
      color: #3D2B1F;
    }

    .bg-pattern {
      background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 0L71.2 48.8L120 60L71.2 71.2L60 120L48.8 71.2L0 60L48.8 48.8L60 0Z' fill='none' stroke='%23D4AF37' stroke-width='0.5' opacity='0.06'/%3E%3C/svg%3E");
      background-repeat: repeat;
    }

    .screenshot-shadow {
      filter: drop-shadow(0 20px 40px rgba(61, 43, 31, 0.12));
    }

    .vertical-text {
      writing-mode: vertical-rl;
    }
  </style>
<style>#brand-footer{bottom:36px!important}#canvas>div:last-child{display:none!important}</style></head>
<body>
  <div class="w-[1080px] h-[1920px] overflow-hidden relative bg-[#FFFCF2] flex flex-col items-center" id="canvas">
    <!-- Background Pattern -->
    <div class="absolute inset-0 bg-pattern"></div>
    
    <!-- Header / Headlines -->
    <div class="absolute top-[120px] left-1/2 -translate-x-1/2 w-[920px] text-center z-50" id="headline-container">
      <h1 class="text-[78px] leading-[1.3] font-medium text-[#3D2B1F] tracking-tight" id="main-headline">
        اقرأ بتأنٍّ<br>واستمع
      </h1>
      <p class="text-[36px] mt-8 text-[#3D2B1F]/70 font-medium" id="sub-headline">
        مصحف واضح وتلاوة من داخل الصفحة
      </p>
    </div>

    <!-- Image Composition -->
    <div class="absolute inset-0 z-10">
      <!-- Secondary Image (Left, Behind) -->
      <div class="absolute left-[-35px] top-[850px] w-[440px] rotate-[12deg] z-10" id="secondary-img-wrapper">
        <img 
          src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/content-assets/eacb608c7cd2769a9151e76dbcd3e1bc708d9383a19c78be770758a025a69f77/02-quran-index.png" 
          alt="Quran Index" 
          class="w-full h-auto rounded-[20px] screenshot-shadow"
          id="img-index"
        >
      </div>

      <!-- Primary Image (Right, Top) -->
      <div class="absolute left-[310px] top-[550px] w-[660px] rotate-[-7deg] z-20" id="primary-img-wrapper">
        <img 
          src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/content-assets/2866b701e660781d85b20661e3b6c833bbaf395805c5a429eea63820821892fc/04-reader-clean.png" 
          alt="Talia Reader"
          class="w-full h-auto rounded-[20px] screenshot-shadow border-white/50 border-[2px]"
          id="img-reader"
        >
      </div>
    </div>

    <!-- Brand Identity (Bottom) -->
    <div class="absolute bottom-[100px] left-1/2 -translate-x-1/2 flex flex-col items-center gap-4 z-50" id="brand-footer">
      <img 
        src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/brand-assets/talia-official-logo/logo_new.png" 
        alt="Talia Logo" 
        class="h-[64px] w-auto object-contain" 
        id="footer-logo"
      >
      <div class="flex flex-col items-center leading-tight">
        <span class="text-[24px] font-bold text-[#3D2B1F]">تالية القرآن</span>
      </div>
    </div>

    <!-- Edge Gradient for Softness -->
    <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,_transparent_0%,_rgba(255,252,242,0.2)_100%)]"></div>
  </div>
</body>
</html>
