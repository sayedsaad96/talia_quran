<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'Reem Kufi';
      src: url('https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/brand-assets/talia-arabic-font/ReemKufi-Variable.ttf') format('truetype');
      font-weight: 400 700;
      font-display: swap;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Reem Kufi', sans-serif;
      background-color: #FFFCF2;
      color: #3D3425;
    }

    .bg-tessellation {
      background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 0L71.2 48.8L120 60L71.2 71.2L60 120L48.8 71.2L0 60L48.8 48.8L60 0ZM30 30L35.6 54.4L60 60L35.6 65.6L30 90L24.4 65.6L0 60L24.4 54.4L30 30ZM90 30L95.6 54.4L120 60L95.6 65.6L90 90L84.4 65.6L60 60L84.4 54.4L90 30Z' fill='none' stroke='%23C4A365' stroke-width='0.4' opacity='0.09'/%3E%3C/svg%3E");
      background-repeat: repeat;
    }

    .screenshot-shadow {
      filter: drop-shadow(0 30px 60px rgba(61, 52, 37, 0.15));
    }
  </style>
<style>#canvas>div:last-child{display:none!important}</style></head>
<body>
  <div class="w-[1080px] h-[1920px] overflow-hidden relative bg-[#FFFCF2]" id="canvas">
    <!-- Islamic Background Pattern -->
    <div class="absolute inset-0 bg-tessellation"></div>
    
    <!-- Top Branding Row -->
    <div class="absolute top-[65px] right-[100px] flex items-center gap-3 z-50" id="top-brand">
      <span class="text-[24px] font-bold text-[#3D3425]">تالية القرآن</span>
      <img 
        src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/brand-assets/talia-official-logo/logo_new.png" 
        alt="Talia Logo" 
        class="h-[64px] w-auto object-contain" 
        id="header-logo"
      >
    </div>

    <!-- Headlines Section -->
    <div class="absolute top-[175px] right-[100px] w-[880px] flex flex-col items-start text-right z-50" id="headline-container">
      <h1 class="text-[86px] leading-[1.3] font-bold text-[#3D3425] tracking-tight" id="main-headline">
        اقرأ بتأنٍّ<br>واستمع
      </h1>
      <div class="w-[60px] h-[2px] bg-[#C4A365]/60 mt-8 mb-6" id="gold-divider"></div>
      <p class="text-[36px] text-[#3D3425]/80 font-medium" id="sub-headline">
        مصحف واضح وتلاوة من داخل الصفحة
      </p>
    </div>

    <!-- Image Composition Area -->
    <div class="absolute inset-0 z-10">
      <!-- Secondary Image (Left, Behind) -->
      <div class="absolute left-[-45px] top-[870px] w-[480px] rotate-[9deg] z-10" id="secondary-img-wrapper">
        <img 
          src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/content-assets/eacb608c7cd2769a9151e76dbcd3e1bc708d9383a19c78be770758a025a69f77/02-quran-index.png" 
          alt="Quran Index" 
          class="w-full h-auto rounded-[22px] screenshot-shadow border-white/40 border-[1px]"
          id="img-index"
        >
      </div>

      <!-- Primary Image (Right, Dominant with Crop) -->
      <div class="absolute left-[260px] top-[660px] w-[750px] h-[1000px] rotate-[-5deg] z-20 overflow-hidden rounded-[22px] screenshot-shadow border-white/50 border-[1.5px]" id="primary-crop-wrapper">
        <!-- Shifted up by 333px to crop upper blank area -->
        <img 
          src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/content-assets/2866b701e660781d85b20661e3b6c833bbaf395805c5a429eea63820821892fc/04-reader-clean.png" 
          alt="Talia Reader"
          class="w-full h-auto absolute top-[-333px] left-0"
          id="img-reader"
        >
      </div>
    </div>

    <!-- Bottom Brand Identity -->
    <div class="absolute bottom-[80px] left-1/2 -translate-x-1/2 flex items-center gap-4 z-50" id="bottom-brand">
      <div class="h-[1px] w-[40px] bg-[#3D3425]/20"></div>
      <span class="text-[24px] font-bold text-[#3D3425]/60 tracking-[0.1em]">تالية القرآن</span>
      <div class="h-[1px] w-[40px] bg-[#3D3425]/20"></div>
    </div>

    <!-- Final Softening Gradient -->
    <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,_transparent_0%,_rgba(255,252,242,0.15)_100%)]"></div>
  </div>
</body>
</html>
