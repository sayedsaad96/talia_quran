    }
  </style>

<body>
  <div class="w-[1080px] h-[1920px] overflow-hidden relative bg-[#FFFCF2]" id="canvas">
    <!-- Islamic Background Pattern -->
    <div class="absolute inset-0 bg-tessellation"></div>
    
    <!-- Top Branding Row -->
    <div class="absolute top-[65px] right-[100px] flex items-center gap-3 z-50" id="top-brand">
      <span class="text-[24px] font-bold text-[#3D3425]">تالية القرآن</span>
      <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/brand-assets/talia-official-logo/logo_new.png" alt="Talia Logo" class="h-[64px] w-auto object-contain" id="header-logo">
    </div>

    <!-- Headlines Section -->
    <div class="absolute top-[175px] right-[100px] w-[880px] flex flex-col items-start text-right z-50" id="headline-container">
      <h1 class="text-[86px] leading-[1.3] font-bold text-[#3D3425] tracking-tight" id="main-headline">حفظك ومراجعتك<br>في مكان واحد</h1>
      <div class="w-[60px] h-[2px] bg-[#C4A365]/60 mt-8 mb-6" id="gold-divider"></div>
      <p class="text-[34px] text-[#3D3425]/80 font-medium" id="sub-headline">خطتك اليومية والتدريب والمراجعة</p>
    </div>

    <!-- Image Composition Area -->
    <div class="absolute inset-0 z-10">
      <!-- Secondary Image (Right, Behind) -->
      <div class="absolute left-[760px] top-[940px] w-[400px] rotate-[-8deg] z-10" id="secondary-img-wrapper">
        <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/content-assets/42be8563016ddede6427c3588ff729cc82669c7b95a8817f87801ec002d4f4a8/09-hifz-create.png" alt="Hifz Creation Screen" class="w-full h-auto rounded-[22px] screenshot-shadow border-white/40 border-[1px]" id="img-hifz-create">
      </div>

      <!-- Primary Image (Center-Left, Dominant) -->
      <div class="absolute left-[225px] top-[640px] w-[660px] rotate-[3deg] z-20 overflow-visible" id="campaign-main-frame">
        <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/1e8d0a36-f2e3-4302-b966-9a9a009d58e9/content-assets/3662664e1a5970a4101e62562a5755248049d6d30b94f6ec6d9235cdbba5bc23/08-adult-hub.png" alt="Adult Hifz Hub" class="w-full h-auto rounded-[22px] screenshot-shadow border-white/50 border-[1.5px]" id="campaign-main-image">
      </div>
    </div>

    <!-- Bottom Brand Identity -->
    <div class="absolute bottom-[80px] left-1/2 -translate-x-1/2 flex items-center gap-4 z-50" id="bottom-brand" style="bottom: 32px;">
      <div class="h-[1px] w-[40px] bg-[#3D3425]/20"></div>
      <span class="text-[24px] font-bold text-[#3D3425]/60 tracking-[0.1em]">تالية القرآن</span>
      <div class="h-[1px] w-[40px] bg-[#3D3425]/20"></div>
    </div>

    <!-- Final Softening Gradient -->
    <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,_transparent_0%,_rgba(255,252,242,0.15)_100%)]" style="display: none;"></div>
  </div>

</body></html>
