name: talia_quran
description: "تالية — تطبيق تحفيظ القرآن الذكي | Talia Quran Memorization App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  dartz: ^0.10.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_secure_storage: ^11.0.0
  workmanager: ^0.10.9
  flutter_local_notifications: ^22.0.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  just_audio: ^0.10.5
  audio_service: ^0.18.19
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  permission_handler: ^13.0.2
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  meta: ^1.11.0
  speech_to_text: ^7.5.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  confetti: ^0.8.0
  screenshot: ^3.0.0
  supabase_flutter: ^2.8.0
  crypto: ^3.0.6
  qcf_quran_plus: 0.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  gal: ^2.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  package_info_plus: ^10.1.0
  hijri: ^3.0.0
  adhan: ^2.0.0+1
  url_launcher: ^6.3.2
  talia_prayer_delivery:
    path: packages/talia_prayer_delivery


dev_dependencies:
  build_runner: ^2.7.0

  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  isar_community_generator: 3.3.2
  mockito: ^5.5.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: 2.4.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/launcher_adaptive_bg.png"
  adaptive_icon_foreground: "assets/images/launcher_adaptive_fg.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/images/launcher_monochrome.png"

flutter_native_splash:
  color: "#061811"
  image: "assets/images/logo_new_padded.png"
  fullscreen: true
  ios_content_mode: scaleAspectFit
  android_gravity: center
  android_12:
    image: "assets/images/logo_new_padded.png"
    icon_background_color: "#061811"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data/quran.json
    - assets/data/surahs.json
    - assets/data/content_manifest.json
    - assets/data/azkar_release.json
    - assets/data/khatm_dua.json
    - assets/data/daily_ayahs.json
    - assets/data/prayer_cities.json
    - assets/fonts/
    - assets/fonts/TaliaIcons/LICENSE-lucide.txt
    # Runtime image assets. Keep this list explicit so generator input and
    # legacy artwork do not become part of the release bundle accidentally.
    - assets/images/logo_new_padded.png
    - assets/images/logo_new.png
    - assets/images/logo.png
    - assets/images/mosque_bg_vertical.jpg
    - assets/images/mosque_bg.png
    - assets/images/splash_hero.png
    - assets/images/character/talia_hero.png
    - assets/images/character/Talia_Master_Character.png
    - assets/images/kids/house_completed.png
    - assets/images/kids/house_current.png
    - assets/images/kids/house_locked.png
    - assets/images/kids/house_review.png
    - assets/images/kids/ribbon_banner.png
    - assets/images/kids/star_reward.png
    - assets/images/talia/talia_avatar.png
    - assets/images/talia/talia_celebrate.png
    - assets/images/talia/talia_encourage.png
    - assets/images/talia/talia_happy.png
    - assets/images/talia/talia_idle.png
    - assets/images/talia/talia_listening.png
    - assets/images/talia/talia_point_right.png
    - assets/images/talia/talia_reading_quran.png
    - assets/images/talia/talia_speaking.png
    - assets/images/talia/talia_thinking.png
    - assets/images/talia/talia_wave.png
    

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf
          weight: 700
    - family: Noto_Naskh_Arabic
      fonts:
        - asset: assets/fonts/Noto_Naskh_Arabic/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/Noto_Naskh_Arabic/NotoNaskhArabic-Bold.ttf
          weight: 700
    # Latin/digits companion to Noto Naskh Arabic (primary UI family; Arabic
    # glyphs fall back to Naskh). OFL: assets/fonts/Noto_Sans/OFL.txt
    - family: Noto_Sans
      fonts:
        - asset: assets/fonts/Noto_Sans/NotoSans-Regular.ttf
        - asset: assets/fonts/Noto_Sans/NotoSans-Bold.ttf
          weight: 700
    # Display Kufi for share-card eyebrows, wordmark and numerals only.
    # OFL: assets/fonts/Reem_Kufi/OFL.txt
    - family: Reem_Kufi
      fonts:
        - asset: assets/fonts/Reem_Kufi/ReemKufi-Variable.ttf
    - family: MrsSaintDelafield
      fonts:
        - asset: assets/fonts/Mrs_Saint_Delafield/MrsSaintDelafield-Regular.ttf
    # Talia icon system, generated by tools/icons/build_talia_icons.py.
    # Generic glyphs are based on Lucide (ISC): assets/fonts/TaliaIcons/LICENSE-lucide.txt
    - family: TaliaIcons
      fonts:
        - asset: assets/fonts/TaliaIcons/TaliaIcons.ttf
    - family: TaliaIconsKids
      fonts:
        - asset: assets/fonts/TaliaIcons/TaliaIconsKids.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
