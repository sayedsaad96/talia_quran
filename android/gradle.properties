org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.parallel=true
android.builtInKotlin=true
# The pub cache lives on C: while the project lives on D:; Kotlin incremental
# compilation cannot compute relative paths across drives on Windows, which
# corrupts the caches ("different roots" / "Could not close incremental caches").
kotlin.incremental=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
