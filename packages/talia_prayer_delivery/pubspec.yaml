environment:
  sdk: ^3.11.4
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.talia.quran.prayer
        pluginClass: TaliaPrayerDeliveryPlugin
