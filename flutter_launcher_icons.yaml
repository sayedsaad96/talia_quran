# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21

  adaptive_icon_background: "assets/images/launcher_adaptive_bg.png"
  adaptive_icon_foreground: "assets/images/launcher_adaptive_fg.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/images/launcher_monochrome.png"

  web:
    generate: true
    image_path: "assets/images/launcher_icon_full.png"
    background_color: "#03140F"
    theme_color: "#0B3D2E"

  windows:
    generate: true
    image_path: "assets/images/launcher_icon_full.png"
    icon_size: 48

